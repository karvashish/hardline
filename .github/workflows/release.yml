name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g. v0.1.0). Must already exist.'
        required: true
        type: string

permissions: {}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./... -count=1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: unit-tests
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            setup_arch: x64
            arch_token: x86-64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            setup_arch: arm64
            arch_token: aarch64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            setup_arch: arm64
            arch_token: arm64
          # darwin/amd64 has no Intel runner; build it on Apple Silicon under
          # Rosetta with an x86_64 Go toolchain (native-amd64 env, not a cross
          # build, so the cgo plugin links cleanly).
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            setup_arch: x64
            arch_token: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Rosetta 2
        if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.setup_arch }}
          cache: true

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build (hardline, profiletool, firewall_template.so)
        run: make build

      - name: Verify built architecture
        env:
          ARCH_TOKEN: ${{ matrix.arch_token }}
        run: |
          set -euo pipefail
          for f in tmp/hardline tmp/profiletool tmp/plugins/firewall_template.so; do
            got=$(file -b "$f")
            echo "$f: $got"
            case "$got" in
              *"$ARCH_TOKEN"*) ;;
              *) echo "::error::$f is not $ARCH_TOKEN"; exit 1 ;;
            esac
          done

      - name: Stage release archive
        id: stage
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          PKG="hardline-${VERSION}-${GOOS}-${GOARCH}"
          STAGE="dist/${PKG}"
          mkdir -p "${STAGE}/plugins"
          install -m 0755 tmp/hardline "${STAGE}/hardline"
          install -m 0755 tmp/profiletool "${STAGE}/profiletool"
          install -m 0644 tmp/plugins/firewall_template.so "${STAGE}/plugins/firewall_template.so"
          install -m 0644 .github/release/README.md "${STAGE}/README.md"
          install -m 0644 LICENSE "${STAGE}/LICENSE"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )
          else
            ( cd dist && shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )
          fi
          rm -rf "${STAGE}"
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/${{ steps.stage.outputs.pkg }}.tar.gz
            dist/${{ steps.stage.outputs.pkg }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build windows/${{ matrix.goarch }}
    needs: unit-tests
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build-windows WIN_GOARCH=${{ matrix.goarch }}

      - name: Stage release archive
        id: stage
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          PKG="hardline-${TAG}-windows-${GOARCH}"
          STAGE="dist/${PKG}"
          mkdir -p "${STAGE}"
          install -m 0755 "tmp/windows/${GOARCH}/hardline.exe" "${STAGE}/hardline.exe"
          install -m 0755 "tmp/windows/${GOARCH}/profiletool.exe" "${STAGE}/profiletool.exe"
          install -m 0644 .github/release/README.md "${STAGE}/README.md"
          install -m 0644 LICENSE "${STAGE}/LICENSE"
          ( cd dist && zip -qr "${PKG}.zip" "${PKG}" )
          ( cd dist && sha256sum "${PKG}.zip" > "${PKG}.zip.sha256" )
          rm -rf "${STAGE}"
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-${{ matrix.goarch }}
          path: |
            dist/${{ steps.stage.outputs.pkg }}.zip
            dist/${{ steps.stage.outputs.pkg }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  profile:
    name: Package ${{ matrix.profile }}
    needs: unit-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - starter-secure-ubuntu-24.04-lts
          - starter-secure-rocky-9
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify starter profile
        run: go run ./cmd/hardline verify-profile profiles/${{ matrix.profile }}

      # The archive is rooted at the profile directory itself, not at profiles/,
      # so an extracted tarball is the directory the user guide names.
      - name: Create profile tarball
        id: pack
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          PKG="${PROFILE}-${VERSION}"
          mkdir -p dist
          tar -C profiles -czf "dist/${PKG}.tar.gz" "${PROFILE}"
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"

      - name: Upload profile artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-profile-${{ matrix.profile }}
          path: |
            dist/${{ steps.pack.outputs.pkg }}.tar.gz
            dist/${{ steps.pack.outputs.pkg }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [build, build-windows, profile]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create or update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
